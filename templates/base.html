<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ôn thi Python{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2f5f7; --surface: #ffffff; --ink: #16232e; --muted: #5b6b78;
      --line: #d9e0e6; --accent: #1f6f5c; --accent-soft: #e2f1ec;
      --weak: #b4460f; --weak-soft: #fbe9df; --ok: #1f6f5c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f171d; --surface: #17222b; --ink: #e8eef2; --muted: #93a3af;
        --line: #2a3945; --accent: #4cc2a3; --accent-soft: #143a31;
        --weak: #f08c5a; --weak-soft: #3a2116; --ok: #4cc2a3;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.55;
    }
    header { background: var(--surface); border-bottom: 1px solid var(--line); }
    .bar-inner, main { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    .bar-inner { display: flex; align-items: center; justify-content: space-between; height: 58px; }
    .brand { font-weight: 700; color: var(--ink); text-decoration: none; }
    nav a { color: var(--muted); text-decoration: none; margin-left: 18px; font-weight: 500; }
    nav a:hover, nav a.on { color: var(--accent); }
    main { padding-top: 28px; padding-bottom: 60px; }
    h1 { font-size: 1.6rem; margin: 0 0 6px; }
    h2 { font-size: 1.1rem; margin: 28px 0 10px; }
    .lead { color: var(--muted); margin: 0 0 22px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; }
    .q-title { font-weight: 600; margin: 0 0 10px; }
    .opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
    .opt:hover { background: var(--accent-soft); }
    .opt input { margin-top: 5px; accent-color: var(--accent); }
    code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: .92em; }
    .topic-title { font-weight: 700; color: var(--accent); margin: 30px 0 10px; }
    button, .btn {
      display: inline-block; background: var(--accent); color: #fff; border: 0; border-radius: 8px;
      padding: 12px 22px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
    }
    button:hover, .btn:hover { filter: brightness(1.08); }
    button.ghost, .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .score { font-size: 3rem; font-weight: 700; line-height: 1; }
    .score small { font-size: 1.2rem; color: var(--muted); font-weight: 500; }
    .row { display: grid; grid-template-columns: 1fr 74px; gap: 12px; align-items: center; margin: 12px 0; }
    .row .name { font-weight: 500; display: flex; justify-content: space-between; gap: 8px; }
    .meter { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 6px; }
    .meter span { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
    .meter.weak span { background: var(--weak); }
    .pct { text-align: right; font-weight: 700; }
    .pct.weak { color: var(--weak); }
    .tag { font-size: .78rem; font-weight: 600; color: var(--weak); background: var(--weak-soft); padding: 2px 8px; border-radius: 99px; }
    .tip { border-left: 4px solid var(--weak); background: var(--weak-soft); padding: 12px 16px; border-radius: 0 8px 8px 0; margin-bottom: 10px; }
    .tip b { display: block; }
    .wrong .yours { color: var(--weak); }
    .wrong .right { color: var(--ok); font-weight: 600; }
    .wrong p { margin: 4px 0; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; font-size: .9rem; }
    .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stat b { display: block; font-size: 1.8rem; }
    .stat span { color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <header>
    <div class="bar-inner">
      <a class="brand" href="{{ url_for('quiz') }}">Ôn thi Python</a>
      <nav>
        <a href="{{ url_for('quiz') }}">Làm bài</a>
        <a href="{{ url_for('history') }}">Thống kê</a>
      </nav>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
